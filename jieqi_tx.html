<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>揭棋</title>
<script src="sfx.js"></script>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b2118;font-family:system-ui;color:#f5e6c8}#status{min-height:24px;margin:6px 0;font-size:16px;color:#ffd166}canvas{background:#e9c98b;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:96vw;height:auto;touch-action:manipulation}.controls{margin:12px 0 20px;display:flex;gap:12px}button{padding:8px 24px;border:none;border-radius:6px;background:#c0392b;color:white;font-size:15px;cursor:pointer}button:disabled{background:#555;cursor:not-allowed}#undoBtn{background:#2980b9}#menuBtn{background:#27ae60}
</style>
</head>
<body>
<h1>揭棋</h1>
<div id="status"></div>
<canvas id="board" width="560" height="620"></canvas>
<div class="controls"><button id="undoBtn" disabled>悔棋</button><button id="restart">重新开始</button><button id="menuBtn">返回菜单</button></div>
<script>
(()=>{
const COLS=9,ROWS=10,CELL=60,MARGIN=40,RED='r',BLACK='b',ANIM=200,FLIP=260,DRAW_LIMIT=80;
const NAMES={r:{K:'帅',A:'仕',B:'相',N:'傌',R:'俥',C:'炮',P:'兵'},b:{K:'将',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒'}};
const BACK=['R','N','B','A','K','A','B','N','R'];
const POS_TYPE=Array.from({length:ROWS},()=>Array(COLS).fill(null));
for(let c=0;c<COLS;c++){POS_TYPE[0][c]=BACK[c];POS_TYPE[9][c]=BACK[c];}
POS_TYPE[2][1]='C';POS_TYPE[2][7]='C';POS_TYPE[7][1]='C';POS_TYPE[7][7]='C';
for(let c=0;c<COLS;c+=2){POS_TYPE[3][c]='P';POS_TYPE[6][c]='P';}
const POOL=['A','A','B','B','N','N','R','R','C','C','P','P','P','P','P'];

const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),undoBtn=document.getElementById('undoBtn');
let board,turn,selected,legalMoves,gameOver,winner,noCaptureMoves,history=[],animating=false,animData=null;

const inBoard=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function sf(n){try{if(typeof SFX!=='undefined'&&SFX&&typeof SFX.play==='function'){SFX.play(n);}}catch(e){}}

function initBoard(){
  board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  board[9][4]={type:'K',color:RED,hidden:false};
  board[0][4]={type:'K',color:BLACK,hidden:false};
  const redSpots=[],blackSpots=[];
  for(let c=0;c<COLS;c++){if(c!==4){redSpots.push([9,c]);blackSpots.push([0,c]);}}
  redSpots.push([7,1],[7,7],[6,0],[6,2],[6,4],[6,6],[6,8]);
  blackSpots.push([2,1],[2,7],[3,0],[3,2],[3,4],[3,6],[3,8]);
  const rp=shuffle([...POOL]),bp=shuffle([...POOL]);
  redSpots.forEach(([r,c],i)=>{board[r][c]={type:rp[i],color:RED,hidden:true};});
  blackSpots.forEach(([r,c],i)=>{board[r][c]={type:bp[i],color:BLACK,hidden:true};});
  turn=RED;selected=null;legalMoves=[];gameOver=false;winner=null;noCaptureMoves=0;history=[];animating=false;animData=null;
  updateUndoBtn();
}

function getPseudoMoves(b,r,c){
  const p=b[r][c];if(!p)return[];
  const color=p.color,type=p.hidden?POS_TYPE[r][c]:p.type,moves=[],dirs=[[-1,0],[1,0],[0,-1],[0,1]];
  const add=(nr,nc)=>{if(!inBoard(nr,nc))return;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);};
  if(type==='R'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc;while(inBoard(nr,nc)){const t=b[nr][nc];if(!t)moves.push([nr,nc]);else{if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
  else if(type==='C'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc,j=false;while(inBoard(nr,nc)){const t=b[nr][nc];if(!j){if(!t)moves.push([nr,nc]);else j=true;}else if(t){if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
  else if(type==='N'){const j=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];for(const[dr,dc,lr,lc]of j){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||b[r+lr][c+lc])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
  else if(type==='B'){for(const[dr,dc]of[[-2,-2],[-2,2],[2,-2],[2,2]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(p.hidden){if(color===RED&&nr<5)continue;if(color===BLACK&&nr>4)continue;}if(b[r+dr/2][c+dc/2])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
  else if(type==='A'){for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(p.hidden){if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
  else if(type==='K'){for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
  else if(type==='P'){const f=color===RED?-1:1;add(r+f,c);if(color===RED?r<=4:r>=5){add(r,c-1);add(r,c+1);}}
  return moves;
}

function findKing(b,color){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p&&p.color===color&&!p.hidden&&p.type==='K')return[r,c];}return null;}

function isInCheck(b,color){
  const k=findKing(b,color);if(!k)return true;
  const[kr,kc]=k,enemy=color===RED?BLACK:RED,ek=findKing(b,enemy);
  if(ek){const[er,ec]=ek;if(ec===kc){let bl=false,st=Math.min(kr,er)+1,ed=Math.max(kr,er);for(let r=st;r<ed;r++)if(b[r][kc]){bl=true;break;}if(!bl)return true;}}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(!p||p.color!==enemy)continue;if(getPseudoMoves(b,r,c).some(([mr,mc])=>mr===kr&&mc===kc))return true;}
  return false;
}

function getLegalMoves(b,r,c){
  const p=b[r][c];if(!p)return[];const res=[];
  for(const[nr,nc]of getPseudoMoves(b,r,c)){const cap=b[nr][nc];b[nr][nc]=p;b[r][c]=null;if(!isInCheck(b,p.color))res.push([nr,nc]);b[r][c]=p;b[nr][nc]=cap;}
  return res;
}

function getAllLegalMoves(color){
  const all=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(p&&p.color===color)for(const[nr,nc]of getLegalMoves(board,r,c))all.push({from:[r,c],to:[nr,nc]});}
  return all;
}

function snapshot(){
  return {board:board.map(row=>row.map(p=>p?{...p}:null)),turn,gameOver,winner,noCaptureMoves};
}

function handleClick(r,c){
  if(gameOver||animating||!inBoard(r,c))return;
  const p=board[r][c];
  if(selected){
    if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();return;}
    if(legalMoves.some(([mr,mc])=>mr===r&&mc===c)){
      const from=selected,to={r,c},moving=board[from.r][from.c],cap=board[to.r][to.c];
      selected=null;legalMoves=[];
      history.push(snapshot());updateUndoBtn();
      startMoveAnimation(moving,from,to,cap);
      return;
    }
    selected=null;legalMoves=[];draw();return;
  }
  if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();}
}

function startMoveAnimation(piece,from,to,cap){
  animating=true;
  animData={piece,from,to,cap,phase:'move',startTime:performance.now(),needFlip:!!piece.hidden};
  board[from.r][from.c]=null;
  requestAnimationFrame(step);
}

function step(now){
  const a=animData;
  if(!a){animating=false;return;}
  try{
    if(a.phase==='move'){
      if(now-a.startTime<ANIM){draw();requestAnimationFrame(step);return;}
      board[a.to.r][a.to.c]=a.piece;
      if(a.cap&&a.cap.type==='K'){}
      else if(a.cap){sf('capture');}
      else{sf('move');}
      if(a.needFlip){
        a.phase='flip';a.startTime=performance.now();
        draw();requestAnimationFrame(step);
      }else{
        animData=null;animating=false;
        settle(a.piece,a.to,a.cap);
      }
    }else if(a.phase==='flip'){
      if(now-a.startTime<FLIP){draw();requestAnimationFrame(step);return;}
      a.piece.hidden=false;
      animData=null;animating=false;
      settle(a.piece,a.to,a.cap);
    }
  }catch(e){
    if(animData){
      const x=animData;
      try{board[x.to.r][x.to.c]=x.piece;if(x.needFlip)x.piece.hidden=false;}catch(e2){}
      animData=null;animating=false;
      try{settle(x.piece,x.to,x.cap);draw();}catch(e3){draw();}
    }else{animating=false;draw();}
  }
}

function settle(moving,to,cap){
  if(cap&&cap.type==='K'){
    gameOver=true;winner=moving.color;sf('win');draw();return;
  }
  turn=turn===RED?BLACK:RED;
  if(cap)noCaptureMoves=0;else noCaptureMoves++;
  if(noCaptureMoves>=DRAW_LIMIT){
    gameOver=true;winner=null;sf('win');draw();return;
  }
  const checked=isInCheck(board,turn),oppMoves=getAllLegalMoves(turn);
  if(oppMoves.length===0){
    gameOver=true;winner=moving.color;sf('win');
  }else if(checked){
    sf('check');
  }
  draw();
}

function undo(){
  if(history.length===0||animating)return;
  const s=history.pop();
  board=s.board;turn=s.turn;gameOver=s.gameOver;winner=s.winner;noCaptureMoves=s.noCaptureMoves;
  selected=null;legalMoves=[];updateUndoBtn();draw();
}

function updateUndoBtn(){undoBtn.disabled=history.length===0||animating;}

function drawBoard(){
ctx.clearRect(0,0,canvas.width,canvas.height);
const g=ctx.createLinearGradient(0,0,canvas.width,canvas.height);
g.addColorStop(0,'#d5d5d5');g.addColorStop(0.5,'#c6c6c6');g.addColorStop(1,'#b8b8b8');
ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
for(let i=0;i<500;i++){const nx=Math.random()*canvas.width,ny=Math.random()*canvas.height,nv=80+Math.floor(Math.random()*30);ctx.fillStyle='rgba('+nv+','+nv+','+nv+',0.07)';ctx.fillRect(nx,ny,1.5,1.5);}
const l=MARGIN,t=MARGIN,r=MARGIN+(COLS-1)*CELL,b=MARGIN+(ROWS-1)*CELL;
ctx.strokeStyle='#3a3a3a';ctx.lineWidth=1.8;ctx.lineCap='round';
for(let i=0;i<ROWS;i++){ctx.beginPath();ctx.moveTo(l,t+i*CELL);ctx.lineTo(r,t+i*CELL);ctx.stroke();}
for(let i=0;i<COLS;i++){ctx.beginPath();const x=l+i*CELL;if(i===0||i===COLS-1){ctx.moveTo(x,t);ctx.lineTo(x,b);}else{ctx.moveTo(x,t);ctx.lineTo(x,t+4*CELL);ctx.moveTo(x,t+5*CELL);ctx.lineTo(x,b);}ctx.stroke();}
ctx.beginPath();ctx.moveTo(l+3*CELL,t);ctx.lineTo(l+5*CELL,t+2*CELL);ctx.moveTo(l+5*CELL,t);ctx.lineTo(l+3*CELL,t+2*CELL);ctx.moveTo(l+3*CELL,t+7*CELL);ctx.lineTo(l+5*CELL,t+9*CELL);ctx.moveTo(l+5*CELL,t+7*CELL);ctx.lineTo(l+3*CELL,t+9*CELL);ctx.stroke();
ctx.fillStyle='rgba(48,48,48,0.68)';ctx.font='bold 24px "KaiTi",serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('楚  河',l+2*CELL,t+4.5*CELL);ctx.fillText('汉  界',l+6*CELL,t+4.5*CELL);
}

function drawSinglePiece(x,y,p){
  const rad=CELL*0.42;
  ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle='#f8e6bd';ctx.fill();
  ctx.lineWidth=2;ctx.strokeStyle=p.color===RED?'#b3261e':'#222';ctx.stroke();
  ctx.beginPath();ctx.arc(x,y,rad-4,0,Math.PI*2);ctx.strokeStyle=p.color===RED?'rgba(179,38,30,.45)':'rgba(34,34,34,.35)';ctx.lineWidth=1;ctx.stroke();
  ctx.fillStyle=p.color===RED?'#b3261e':'#111';ctx.font=`bold ${Math.floor(CELL*0.48)}px "KaiTi",serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(NAMES[p.color][p.type],x,y+1);
}

function drawHiddenPiece(x,y,color){
const rad=CELL*0.42,isRed=color===RED;
const g=ctx.createRadialGradient(x-rad*0.3,y-rad*0.35,rad*0.15,x,y,rad);
g.addColorStop(0,'#fffaf0');g.addColorStop(0.55,'#f6e6c4');g.addColorStop(1,'#cbb08a');
ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
ctx.lineWidth=2;ctx.strokeStyle=isRed?'#b3261e':'#222';ctx.stroke();
ctx.beginPath();ctx.arc(x,y,rad-4,0,Math.PI*2);ctx.strokeStyle=isRed?'rgba(179,38,30,0.45)':'rgba(34,34,34,0.35)';ctx.lineWidth=1;ctx.stroke();
const c1=isRed?'rgba(179,38,30,0.85)':'rgba(34,34,34,0.8)';
ctx.beginPath();ctx.arc(x,y,rad*0.30,0,Math.PI*2);ctx.fillStyle=c1;ctx.fill();
for(let i=0;i<8;i++){const a=i*Math.PI/4;const px=x+Math.cos(a)*rad*0.60,py=y+Math.sin(a)*rad*0.60;ctx.beginPath();ctx.arc(px,py,rad*0.058,0,Math.PI*2);ctx.fillStyle=c1;ctx.fill();}
ctx.fillStyle='#fffaf0';ctx.font='bold '+Math.floor(CELL*0.30)+'px "KaiTi",serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',x,y+1);
}

function drawPieceAt(x,y,p){p.hidden?drawHiddenPiece(x,y,p.color):drawSinglePiece(x,y,p);}

function drawPieces(){
  const skip=animating&&animData&&animData.phase==='flip'?animData.to:null;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(skip&&r===skip.r&&c===skip.c)continue;
    const p=board[r][c];if(p)drawPieceAt(MARGIN+c*CELL,MARGIN+r*CELL,p);
  }
}

function drawAnimation(){
  if(!animating||!animData)return;
  const a=animData;
  if(a.phase==='move'){
    const el=performance.now()-a.startTime,t=Math.min(el/ANIM,1),e=1-Math.pow(1-t,3);
    const sx=MARGIN+a.from.c*CELL,sy=MARGIN+a.from.r*CELL,ex=MARGIN+a.to.c*CELL,ey=MARGIN+a.to.r*CELL;
    drawPieceAt(sx+(ex-sx)*e,sy+(ey-sy)*e,a.piece);
  }else{
    const t=Math.min((performance.now()-a.startTime)/FLIP,1);
    const s=Math.max(Math.abs(Math.cos(t*Math.PI)),0.02);
    const x=MARGIN+a.to.c*CELL,y=MARGIN+a.to.r*CELL;
    ctx.save();ctx.translate(x,y);ctx.scale(s,1);ctx.translate(-x,-y);
    if(t<0.5)drawHiddenPiece(x,y,a.piece.color);else drawSinglePiece(x,y,a.piece);
    ctx.restore();
  }
}

function drawSelectionAndMoves(){
  if(animating)return;
  for(const[r,c]of legalMoves){const x=MARGIN+c*CELL,y=MARGIN+r*CELL;if(board[r][c]){ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='rgba(20,150,80,.85)';ctx.lineWidth=4;ctx.stroke();}else{ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle='rgba(20,150,80,.75)';ctx.fill();}}
  if(selected){const x=MARGIN+selected.c*CELL,y=MARGIN+selected.r*CELL;ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=4;ctx.stroke();}
}

function updateStatus(){
  if(gameOver){
    statusEl.textContent=winner===null?'和棋':(winner===RED?'红方胜！':'黑方胜！');
    return;
  }
  let text=`轮到 ${turn===RED?'红方':'黑方'}`;
  if(isInCheck(board,turn))text+=' · 将军！';
  statusEl.textContent=text;
}

function draw(){drawBoard();drawPieces();drawSelectionAndMoves();drawAnimation();updateStatus();}

canvas.addEventListener('click',e=>{
  if(animating)return;
  const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(canvas.width/rect.width),y=(e.clientY-rect.top)*(canvas.height/rect.height);
  const c=Math.round((x-MARGIN)/CELL),r=Math.round((y-MARGIN)/CELL);
  if(!inBoard(r,c))return;
  if(Math.hypot(x-(MARGIN+c*CELL),y-(MARGIN+r*CELL))>CELL*0.55)return;
  handleClick(r,c);
});
undoBtn.addEventListener('click',undo);
document.getElementById('menuBtn').addEventListener('click',()=>{location.href='index.html';});
document.getElementById('restart').addEventListener('click',()=>{initBoard();draw();});
initBoard();draw();
})();
</script>
</body>
</html>
