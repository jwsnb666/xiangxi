<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 - 终极模组</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b2118;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f5e6c8}#status{min-height:24px;margin:6px 0;font-size:16px;color:#ffd166}canvas{background:#e9c98b;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:96vw;height:auto;touch-action:manipulation}.controls{margin:12px 0 20px;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}button{padding:8px 24px;border:none;border-radius:6px;background:#c0392b;color:white;font-size:15px;cursor:pointer}button:hover{filter:brightness(1.2)}.mod-box{background:#3a2c1f;padding:10px;border-radius:8px;display:flex;flex-direction:column;gap:10px;align-items:center;margin-bottom:10px;border:2px dashed #8e44ad;min-width:300px}input[type="file"]{display:none}.upload-btn{background:#8e44ad;display:inline-block;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}#modList{font-size:13px;color:#f1c40f;width:100%;text-align:center}#clearModsBtn{padding:4px 10px;font-size:12px;background:#555;margin-top:5px}
</style>
</head>
<body>
<h1>象棋 · 终极加载器 (双版本兼容)</h1>
<div class="mod-box">
<label class="upload-btn">📁 加载模组包 (.json) <input type="file" id="modFile" accept=".json" multiple></label>
<div id="modList">当前未加载</div>
<button id="clearModsBtn">清空所有模组</button>
</div>
<div id="status"></div>
<canvas id="board" width="560" height="620"></canvas>
<div class="controls">
<button id="undoBtn" disabled>悔棋</button>
<button id="restart">重新开始</button>
<button onclick="window.location.href='index.html'" style="background:#27ae60">返回菜单</button>
</div>
<script>
(()=>{
const COLS=9,ROWS=10,CELL=60,MARGIN=40,RED='r',BLACK='b',ANIM=200;
const sfxMove=new Audio('move.mp3'),sfxCapture=new Audio('capture.mp3'),sfxCheck=new Audio('check.mp3'),sfxWin=new Audio('win.mp3');
sfxMove.preload='auto';sfxCapture.preload='auto';sfxCheck.preload='auto';sfxWin.preload='auto';
let currentAudio=null;
function playSfx(audio){if(currentAudio&&currentAudio!==audio){currentAudio.pause();currentAudio.currentTime=0;}try{audio.currentTime=0;audio.play().catch(()=>{});currentAudio=audio;}catch(e){}}
const NAMES={r:{K:'帅',A:'仕',B:'相',N:'傌',R:'俥',C:'炮',P:'兵'},b:{K:'将',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒'}};
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status'),undoBtn=document.getElementById('undoBtn');
let board,turn,selected,legalMoves,gameOver,winner,history=[],animating=false,animData=null;
let activeMods=[];
const put=(r,c,type,color)=>board[r][c]={type,color};
const inBoard=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
function initBoard(){
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
const back=['R','N','B','A','K','A','B','N','R'];
for(let c=0;c<COLS;c++){put(0,c,back[c],BLACK);put(9,c,back[c],RED);}
put(2,1,'C',BLACK);put(2,7,'C',BLACK);put(7,1,'C',RED);put(7,7,'C',RED);
for(let c=0;c<COLS;c+=2){put(3,c,'P',BLACK);put(6,c,'P',RED);}
activeMods.forEach(mod=>{
NAMES.r[mod.id]=mod.char;
NAMES.b[mod.id]=mod.char;
if(mod.initPos){
if(Array.isArray(mod.initPos)){
const p1=mod.initPos[0]||[2,2], p2=mod.initPos[1]||[7,2];
const count=mod.count||1;
for(let i=0;i<count;i++){
if(p1[1]+i<COLS)put(p1[0],p1[1]+i,mod.id,BLACK);
if(p2[1]+i<COLS)put(p2[0],p2[1]+i,mod.id,RED);
}
}else if(mod.initPos.black&&mod.initPos.red){
mod.initPos.black.forEach(p=>{if(inBoard(p[0],p[1]))put(p[0],p[1],mod.id,BLACK);});
mod.initPos.red.forEach(p=>{if(inBoard(p[0],p[1]))put(p[0],p[1],mod.id,RED);});
}
}
});
turn=RED;selected=null;legalMoves=[];gameOver=false;winner=null;history=[];animating=false;animData=null;updateUndoBtn();draw();
}
function getPseudoMoves(b,r,c){
const p=b[r][c];if(!p)return[];
const{type,color}=p,moves=[],dirs=[[-1,0],[1,0],[0,-1],[0,1]];
const add=(nr,nc)=>{if(!inBoard(nr,nc))return;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);};
if(type==='R'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc;while(inBoard(nr,nc)){const t=b[nr][nc];if(!t)moves.push([nr,nc]);else{if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
else if(type==='C'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc,j=false;while(inBoard(nr,nc)){const t=b[nr][nc];if(!j){if(!t)moves.push([nr,nc]);else j=true;}else if(t){if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
else if(type==='N'){const j=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];for(const[dr,dc,lr,lc]of j){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||b[r+lr][c+lc])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='B'){for(const[dr,dc]of[[-2,-2],[-2,2],[2,-2],[2,2]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||(color===RED&&nr<5)||(color===BLACK&&nr>4)||b[r+dr/2][c+dc/2])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='A'){for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='K'){for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='P'){const f=color===RED?-1:1;add(r+f,c);if(color===RED?r<=4:r>=5){add(r,c-1);add(r,c+1);}}
else {
const mod=activeMods.find(m=>m.id===type);
if(mod){
if(mod.moveOffsets){
mod.moveOffsets.forEach(o=>{
const nr=r+o[0],nc=c+o[1];
if(inBoard(nr,nc)){
const t=b[nr][nc];
if(!t||t.color!==color)moves.push([nr,nc]);
}
});
}else if(mod.moveType){
if(mod.moveType==='knight'){
const j=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];
for(const[dr,dc,lr,lc]of j){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||(mod.blocked&&b[r+lr][c+lc]))continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}
}else{
let modDirs=[];
if(mod.moveType==='orthogonal')modDirs=dirs;
else if(mod.moveType==='diagonal')modDirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
else if(mod.moveType==='all')modDirs=[...dirs,[-1,-1],[-1,1],[1,-1],[1,1]];
for(const[dr,dc]of modDirs){let nr=r+dr,nc=c+dc;for(let step=1;step<=mod.range;step++){if(!inBoard(nr,nc))break;const t=b[nr][nc];if(!t){moves.push([nr,nc]);}else{if(t.color!==color)moves.push([nr,nc]);if(mod.blocked)break;if(t.color!==color)break;}nr+=dr;nc+=dc;}}
}
}
}
}
return moves;
}
function findKing(b,color){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p&&p.color===color&&p.type==='K')return[r,c];}return null;}
function isInCheck(b,color){
const k=findKing(b,color);if(!k)return true;
const[kr,kc]=k,enemy=color===RED?BLACK:RED,ek=findKing(b,enemy);
if(ek){const[er,ec]=ek;if(ec===kc){let bl=false,st=Math.min(kr,er)+1,ed=Math.max(kr,er);for(let r=st;r<ed;r++)if(b[r][kc]){bl=true;break;}if(!bl)return true;}}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(!p||p.color!==enemy)continue;if(getPseudoMoves(b,r,c).some(([mr,mc])=>mr===kr&&mc===kc))return true;}
return false;
}
function getLegalMoves(b,r,c){
const p=b[r][c];if(!p)return[];
const res=[];
for(const[nr,nc]of getPseudoMoves(b,r,c)){
const cap=b[nr][nc];b[nr][nc]=p;b[r][c]=null;
if(!isInCheck(b,p.color))res.push([nr,nc]);
b[r][c]=p;b[nr][nc]=cap;
}
return res;
}
function getAllLegalMoves(color){
const all=[];
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(p&&p.color===color)for(const[nr,nc]of getLegalMoves(board,r,c))all.push({from:[r,c],to:[nr,nc]});}
return all;
}
function handleClick(r,c){
if(gameOver||animating||!inBoard(r,c))return;
const p=board[r][c];
if(selected){
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();return;}
if(legalMoves.some(([mr,mc])=>mr===r&&mc===c)){
const from=selected,to={r,c},moving=board[from.r][from.c],cap=board[to.r][to.c];
selected=null;legalMoves=[];
history.push({from:{...from},to:{...to},piece:{...moving},captured:cap?{...cap}:null,turnBefore:turn});
updateUndoBtn();startMoveAnimation(moving,from,to,cap);return;
}
selected=null;legalMoves=[];draw();return;
}
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();}
}
function startMoveAnimation(piece,from,to,cap){
animating=true;animData={piece,from,to,cap,startTime:performance.now()};
board[from.r][from.c]=null;
function step(now){
if(!animating)return;
if(now-animData.startTime<ANIM){draw();requestAnimationFrame(step);}
else{board[animData.to.r][animData.to.c]=animData.piece;animating=false;animData=null;finishMove(piece,to,cap);}
}
requestAnimationFrame(step);
}
function finishMove(moving,to,cap){
let isWin=false;
if(cap&&cap.type==='K'){isWin=true;}
else{
turn=turn===RED?BLACK:RED;
const oppMoves=getAllLegalMoves(turn),checked=isInCheck(board,turn);
if(oppMoves.length===0){isWin=true;}
else if(checked){playSfx(sfxCheck);}
else if(cap){playSfx(sfxCapture);}
else{playSfx(sfxMove);}
}
if(isWin){gameOver=true;winner=moving.color;playSfx(sfxWin);}
draw();
}
function undo(){
if(history.length===0||animating)return;
const l=history.pop();
board[l.from.r][l.from.c]=l.piece;board[l.to.r][l.to.c]=l.captured;
turn=l.turnBefore;gameOver=false;winner=null;selected=null;legalMoves=[];
updateUndoBtn();draw();
}
function updateUndoBtn(){undoBtn.disabled=history.length===0||animating;}
function drawBoard(){
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e9c98b';ctx.fillRect(0,0,canvas.width,canvas.height);
const l=MARGIN,t=MARGIN,r=MARGIN+(COLS-1)*CELL,b=MARGIN+(ROWS-1)*CELL;
ctx.strokeStyle='#5a3a1a';ctx.lineWidth=1.5;ctx.lineCap='round';
for(let i=0;i<ROWS;i++){ctx.beginPath();ctx.moveTo(l,t+i*CELL);ctx.lineTo(r,t+i*CELL);ctx.stroke();}
for(let i=0;i<COLS;i++){ctx.beginPath();const x=l+i*CELL;if(i===0||i===COLS-1){ctx.moveTo(x,t);ctx.lineTo(x,b);}else{ctx.moveTo(x,t);ctx.lineTo(x,t+4*CELL);ctx.moveTo(x,t+5*CELL);ctx.lineTo(x,b);}ctx.stroke();}
ctx.beginPath();ctx.moveTo(l+3*CELL,t);ctx.lineTo(l+5*CELL,t+2*CELL);ctx.moveTo(l+5*CELL,t);ctx.lineTo(l+3*CELL,t+2*CELL);ctx.moveTo(l+3*CELL,t+7*CELL);ctx.lineTo(l+5*CELL,t+9*CELL);ctx.moveTo(l+5*CELL,t+7*CELL);ctx.lineTo(l+3*CELL,t+9*CELL);ctx.stroke();
ctx.fillStyle='rgba(90,58,26,.65)';ctx.font='22px "KaiTi","SimSun",serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('楚  河',l+2*CELL,t+4.5*CELL);ctx.fillText('汉  界',l+6*CELL,t+4.5*CELL);
}
function drawSinglePiece(x,y,p){
const rad=CELL*0.42;
ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle='#f8e6bd';ctx.fill();
ctx.lineWidth=2;ctx.strokeStyle=p.color===RED?'#b3261e':'#222';ctx.stroke();
if(activeMods.some(m=>m.id===p.type)){ctx.strokeStyle=p.color===RED?'#ff8c00':'#5a3a1a';ctx.lineWidth=3;ctx.stroke();}
ctx.beginPath();ctx.arc(x,y,rad-4,0,Math.PI*2);ctx.strokeStyle=p.color===RED?'rgba(179,38,30,.45)':'rgba(34,34,34,.35)';ctx.lineWidth=1;ctx.stroke();
ctx.fillStyle=p.color===RED?'#b3261e':'#111';ctx.font=`bold ${Math.floor(CELL*0.48)}px "KaiTi","SimSun",serif`;ctx.fillText(NAMES[p.color][p.type],x,y+1);
}
function drawPieces(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(p)drawSinglePiece(MARGIN+c*CELL,MARGIN+r*CELL,p);}}
function drawAnimation(){
if(!animating||!animData)return;
const el=performance.now()-animData.startTime,t=Math.min(el/ANIM,1),e=1-Math.pow(1-t,3);
const sx=MARGIN+animData.from.c*CELL,sy=MARGIN+animData.from.r*CELL,ex=MARGIN+animData.to.c*CELL,ey=MARGIN+animData.to.r*CELL;
drawSinglePiece(sx+(ex-sx)*e,sy+(ey-sy)*e,animData.piece);
}
function drawSelectionAndMoves(){
if(animating)return;
for(const[r,c]of legalMoves){const x=MARGIN+c*CELL,y=MARGIN+r*CELL;if(board[r][c]){ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='rgba(20,150,80,.85)';ctx.lineWidth=4;ctx.stroke();}else{ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle='rgba(20,150,80,.75)';ctx.fill();}}
if(selected){const x=MARGIN+selected.c*CELL,y=MARGIN+selected.r*CELL;ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=4;ctx.stroke();}
}
function updateStatus(){
if(gameOver){statusEl.textContent=winner===RED?'红方胜！':'黑方胜！';return;}
let text=`轮到 ${turn===RED?'红方':'黑方'}`;
if(isInCheck(board,turn))text+=' · 将军！';
statusEl.textContent=text;
}
function draw(){drawBoard();drawPieces();drawSelectionAndMoves();drawAnimation();updateStatus();}
canvas.addEventListener('click',e=>{
if(animating)return;
const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(canvas.width/rect.width),y=(e.clientY-rect.top)*(canvas.height/rect.height);
const c=Math.round((x-MARGIN)/CELL),r=Math.round((y-MARGIN)/CELL);
if(!inBoard(r,c))return;
if(Math.hypot(x-(MARGIN+c*CELL),y-(MARGIN+r*CELL))>CELL*0.55)return;
handleClick(r,c);
});
undoBtn.addEventListener('click',undo);
document.getElementById('restart').addEventListener('click',()=>{initBoard();});
document.getElementById('modFile').addEventListener('change',e=>{
const files=e.target.files;
if(!files.length)return;
for(let i=0;i<files.length;i++){
const file=files[i];
const reader=new FileReader();
reader.onload=(evt)=>{
try{
const modData=JSON.parse(evt.target.result);
if(modData.id&&modData.char&&modData.initPos){
if(activeMods.some(m=>m.id===modData.id)){alert(`模组【${modData.name||modData.char}】已经加载过了！`);}
else{activeMods.push(modData);updateModListUI();initBoard();}
}else{alert(`文件 ${file.name} 格式不正确！`);}
}catch(err){alert(`读取文件 ${file.name} 失败！`);}
};
reader.readAsText(file);
}
e.target.value='';
});
document.getElementById('clearModsBtn').addEventListener('click',()=>{
activeMods=[];updateModListUI();initBoard();
});
function updateModListUI(){
const el=document.getElementById('modList');
if(activeMods.length===0){el.textContent='当前未加载任何模组';return;}
el.innerHTML=`已加载模组: ${activeMods.map(m=>m.name||m.char).join('、')}`;
}
initBoard();
})();
</script>
</body>
</html>
