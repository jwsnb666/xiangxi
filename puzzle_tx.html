<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>残局挑战</title>
<script src="sfx.js"></script><script src="puzzles.js"></script>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#1e2a38 0%,#111820 100%);font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f5e6c8;display:flex;flex-direction:column;align-items:center}
.header{width:100%;max-width:600px;text-align:center;padding:20px 0;background:url('data:image/svg+xml;utf8,<svg preserveAspectRatio="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><polygon points="0,0 100,0 100,80 50,100 0,80" fill="%231f3a5c" stroke="%23d4af37" stroke-width="1" /></svg>') no-repeat center top;background-size:100% 100%;margin-bottom:20px;filter:drop-shadow(0 10px 15px rgba(0,0,0,0.6))}
.header h1{margin:0;font-size:26px;color:#fff;letter-spacing:2px;text-shadow:0 2px 4px rgba(0,0,0,0.8)}
.header p{margin:5px 0 15px 0;font-size:14px;color:#d4af37;font-weight:bold}
.grid-container{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;width:92%;max-width:500px;padding-bottom:30px}
.level-card{background:#fdf5e6;border-radius:10px;box-shadow:0 8px 15px rgba(0,0,0,0.4),inset 0 0 0 2px #d4af37;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform .1s}
.level-card:active{transform:scale(0.96)}
.card-top{padding:10px 10px 5px 10px;display:flex;flex-direction:column;align-items:center}
.card-title{font-size:18px;font-weight:bold;color:#3e2723;margin-bottom:4px}
.card-desc{font-size:12px;color:#d32f2f;font-weight:bold}
.card-id{background:#e0e0e0;color:#666;font-size:12px;text-align:center;padding:4px 0;font-weight:bold}
#gameArea{display:none;flex-direction:column;align-items:center;width:100%}
#status{min-height:24px;margin:10px 0;font-size:16px;color:#ffd166;font-weight:bold}
canvas{background:#e9c98b;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:96vw;height:auto;border:3px solid #5a3a1a}
.controls{margin:15px 0 30px 0;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{padding:10px 20px;border:none;border-radius:6px;color:white;font-size:15px;font-weight:bold;cursor:pointer}
#backBtn{background:#455a64}#restartBtn{background:#c0392b}#undoBtn{background:#e67e22}
</style>
</head>
<body>
<a href="index.html" style="position:fixed; top:20px; right:20px; color:#fff; background:rgba(200,0,0,0.8); padding:8px 15px; text-decoration:none; border-radius:5px; border:2px solid #fff; z-index:9999; font-family:'KaiTi'; font-weight:bold; box-shadow:0 0 10px red;">退出主菜单</a >
<div id="menuArea" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="header"><h1>残局挑战</h1><p id="progressText">已通关: 0/0</p ></div>
<div class="grid-container" id="levelGrid"></div>
</div>
<div id="gameArea">
<h2 id="gameTitle" style="color:#d4af37;margin:10px 0"></h2><div id="status"></div>
<canvas id="board" width="560" height="620"></canvas>
<div class="controls">
<button id="undoBtn">悔棋</button>
<button id="restartBtn">重试</button>
<button id="backBtn">返回选关</button>
</div>
</div>
<script>
(()=>{
const COLS=9,ROWS=10,CELL=60,MARGIN=40,RED='r',BLACK='b',ANIM=200,NAMES={r:{K:'帅',A:'仕',B:'相',N:'傌',R:'俥',C:'炮',P:'兵'},b:{K:'将',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒'}},VALUES={K:99999,R:900,C:500,N:450,A:200,B:200,P:100};

const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status');
let board,turn,selected,legalMoves,gameOver,winner,animating=false,animData=null,isAiThinking=false,currentPuzzle=null,currentLevelIndex=0,passedLevels=JSON.parse(localStorage.getItem('passedLevels')||'[]');

function initMenu(){
const grid=document.getElementById('levelGrid');grid.innerHTML='';if(typeof PUZZLES==='undefined'||PUZZLES.length===0)return;
document.getElementById('progressText').innerText=`已通关: ${passedLevels.length}/${PUZZLES.length}`;
PUZZLES.forEach((p,index)=>{
const card=document.createElement('div');card.className='level-card';
if(passedLevels.includes(index))card.style.boxShadow='0 0 15px #d4af37,inset 0 0 0 2px #d4af37';
card.innerHTML=`<div class="card-top"><div class="card-title">${p.name}</div><div class="card-desc">${p.desc}</div></div><div class="card-id">编号: ${index+1}</div>`;
card.onclick=()=>startPuzzle(index);grid.appendChild(card);
});
}
function startPuzzle(index){
document.getElementById('menuArea').style.display='none';document.getElementById('gameArea').style.display='flex';
currentLevelIndex=index;currentPuzzle=PUZZLES[index];document.getElementById('gameTitle').textContent=currentPuzzle.name;initBoard();
}
document.getElementById('backBtn').addEventListener('click',()=>{document.getElementById('menuArea').style.display='flex';document.getElementById('gameArea').style.display='none';initMenu();});
function initBoard(){
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=currentPuzzle.board[r][c];if(p)board[r][c]={type:p[1],color:p[0]};}
turn=RED;selected=null;legalMoves=[];gameOver=false;winner=null;animating=false;animData=null;isAiThinking=false;draw();statusEl.textContent="你执红方，请走棋";
}
const inBoard=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
function getPseudoMoves(b,r,c){
const p=b[r][c];if(!p)return[];const{type,color}=p,moves=[],dirs=[[-1,0],[1,0],[0,-1],[0,1]];
const add=(nr,nc)=>{if(!inBoard(nr,nc))return;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);};
if(type==='R'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc;while(inBoard(nr,nc)){const t=b[nr][nc];if(!t)moves.push([nr,nc]);else{if(t.color!==color)moves.push([nr,nc]);break}nr+=dr;nc+=dc}}}
else if(type==='C'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc,j=false;while(inBoard(nr,nc)){const t=b[nr][nc];if(!j){if(!t)moves.push([nr,nc]);else j=true}else if(t){if(t.color!==color)moves.push([nr,nc]);break}nr+=dr;nc+=dc}}}
else if(type==='N'){const j=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];for(const[dr,dc,lr,lc]of j){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||b[r+lr][c+lc])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='B'){for(const[dr,dc]of[[-2,-2],[-2,2],[2,-2],[2,2]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||(color===RED&&nr<5)||(color===BLACK&&nr>4)||b[r+dr/2][c+dc/2])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='A'){for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue}else{if(nr<0||nr>2||nc<3||nc>5)continue}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='K'){for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue}else{if(nr<0||nr>2||nc<3||nc>5)continue}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='P'){const f=color===RED?-1:1;add(r+f,c);if(color===RED?r<=4:r>=5){add(r,c-1);add(r,c+1);}}
return moves;
}
function findKing(b,color){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p&&p.color===color&&p.type==='K')return[r,c];}return null;}
function isInCheck(b,color){
const k=findKing(b,color);if(!k)return true;const[kr,kc]=k,enemy=color===RED?BLACK:RED,ek=findKing(b,enemy);
if(ek){const[er,ec]=ek;if(ec===kc){let bl=false,st=Math.min(kr,er)+1,ed=Math.max(kr,er);for(let r=st;r<ed;r++)if(b[r][kc]){bl=true;break}if(!bl)return true}}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(!p||p.color!==enemy)continue;if(getPseudoMoves(b,r,c).some(([mr,mc])=>mr===kr&&mc===kc))return true}
return false;
}
function getLegalMoves(b,r,c){const p=b[r][c];if(!p)return[];const res=[];for(const[nr,nc]of getPseudoMoves(b,r,c)){const cap=b[nr][nc];b[nr][nc]=p;b[r][c]=null;if(!isInCheck(b,p.color))res.push([nr,nc]);b[r][c]=p;b[nr][nc]=cap}return res}
function getAllLegalMoves(b,color){const all=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p&&p.color===color)for(const[nr,nc]of getLegalMoves(b,r,c))all.push({from:[r,c],to:[nr,nc]})}return all}
function evaluateBoard(b){let score=0;for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p){let val=VALUES[p.type];if(p.type==='P'){if(p.color===RED)val+=r<5?50:0;else val+=r>4?50:0}else if(p.type==='R'||p.type==='C'||p.type==='N'){if(p.color===RED&&r<9)val+=20;if(p.color===BLACK&&r>0)val+=20}score+=p.color===BLACK?val:-val}}if(isInCheck(b,RED))score+=30;return score}
function minimax(b,depth,alpha,beta,isMax){
if(depth===0||!findKing(b,RED)||!findKing(b,BLACK))return evaluateBoard(b);
const moves=getAllLegalMoves(b,isMax?BLACK:RED);if(moves.length===0)return isMax?-99999:99999;
moves.sort((m1,m2)=>{const c1=b[m1.to[0]][m1.to[1]],c2=b[m2.to[0]][m2.to[1]],v1=c1?VALUES[c1.type]:0,v2=c2?VALUES[c2.type]:0;return v2-v1});
if(isMax){let maxE=-Infinity;for(const m of moves){const p=b[m.from[0]][m.from[1]],cap=b[m.to[0]][m.to[1]];b[m.to[0]][m.to[1]]=p;b[m.from[0]][m.from[1]]=null;const e=minimax(b,depth-1,alpha,beta,false);b[m.from[0]][m.from[1]]=p;b[m.to[0]][m.to[1]]=cap;maxE=Math.max(maxE,e);alpha=Math.max(alpha,e);if(beta<=alpha)break}return maxE;}
else{let minE=Infinity;for(const m of moves){const p=b[m.from[0]][m.from[1]],cap=b[m.to[0]][m.to[1]];b[m.to[0]][m.to[1]]=p;b[m.from[0]][m.from[1]]=null;const e=minimax(b,depth-1,alpha,beta,true);b[m.from[0]][m.from[1]]=p;b[m.to[0]][m.to[1]]=cap;minE=Math.min(minE,e);beta=Math.min(beta,e);if(beta<=alpha)break}return minE;}
}
function makeAiMove(){
if(gameOver)return;isAiThinking=true;statusEl.textContent='电脑思考中...';
setTimeout(()=>{
const moves=getAllLegalMoves(board,BLACK);if(moves.length===0){isAiThinking=false;return;}
moves.sort((m1,m2)=>{const c1=board[m1.to[0]][m1.to[1]],c2=board[m2.to[0]][m2.to[1]],v1=c1?VALUES[c1.type]:0,v2=c2?VALUES[c2.type]:0;return v2-v1});
let bestM=-Infinity,bestMove=moves[0];
for(const m of moves){const p=board[m.from[0]][m.from[1]],cap=board[m.to[0]][m.to[1]];board[m.to[0]][m.to[1]]=p;board[m.from[0]][m.from[1]]=null;const score=minimax(board,4,-Infinity,Infinity,false);board[m.from[0]][m.from[1]]=p;board[m.to[0]][m.to[1]]=cap;if(score>bestM){bestM=score;bestMove=m;}}
isAiThinking=false;const moving=board[bestMove.from[0]][bestMove.from[1]],captured=board[bestMove.to[0]][bestMove.to[1]];
startMoveAnimation(moving,{r:bestMove.from[0],c:bestMove.from[1]},{r:bestMove.to[0],c:bestMove.to[1]},captured);
},300);
}
function handleClick(r,c){
if(gameOver||animating||isAiThinking||turn===BLACK||!inBoard(r,c))return;
const p=board[r][c];
if(selected){
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();return;}
if(legalMoves.some(([mr,mc])=>mr===r&&mc===c)){const from=selected,to={r,c},moving=board[from.r][from.c],cap=board[to.r][to.c];selected=null;legalMoves=[];startMoveAnimation(moving,from,to,cap);return;}
selected=null;legalMoves=[];draw();return;
}
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();}
}
function startMoveAnimation(piece,from,to,cap){
animating=true;animData={piece,from,to,cap,startTime:performance.now()};board[from.r][from.c]=null;
function step(now){
if(!animating)return;
if(now-animData.startTime<ANIM){draw();requestAnimationFrame(step);}
else{board[animData.to.r][animData.to.c]=animData.piece;animating=false;animData=null;finishMove(piece,to,cap);}
}
requestAnimationFrame(step);
}
function finishMove(moving,to,cap){
let isWin=false;
if(cap&&cap.type==='K'){isWin=true;}
else{
turn=turn===RED?BLACK:RED;
const oppMoves=getAllLegalMoves(board,turn),checked=isInCheck(board,turn);
if(oppMoves.length===0){isWin=true;}
else if(checked){SFX.play('check');}
else if(cap){SFX.play('capture');}
else{SFX.play('move');}
}
if(isWin){
gameOver=true;winner=moving.color;SFX.play('win');
if(winner===RED&&!passedLevels.includes(currentLevelIndex)){passedLevels.push(currentLevelIndex);localStorage.setItem('passedLevels',JSON.stringify(passedLevels));}
}
draw();
if(turn===BLACK&&!gameOver){makeAiMove();}
}

// ==========仅此处修改为石桌象棋硬编码配色，其他全部不动==========
function drawBoard(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="#b4c2cc";
ctx.fillRect(0,0,canvas.width,canvas.height);
const l=MARGIN,t=MARGIN,r=MARGIN+(COLS-1)*CELL,b=MARGIN+(ROWS-1)*CELL;
ctx.strokeStyle="#2c3e50";
ctx.lineWidth=1.5;ctx.lineCap='round';
for(let i=0;i<ROWS;i++){ctx.beginPath();ctx.moveTo(l,t+i*CELL);ctx.lineTo(r,t+i*CELL);ctx.stroke();}
for(let i=0;i<COLS;i++){ctx.beginPath();const x=l+i*CELL;if(i===0||i===COLS-1){ctx.moveTo(x,t);ctx.lineTo(x,b);}else{ctx.moveTo(x,t);ctx.lineTo(x,t+4*CELL);ctx.moveTo(x,t+5*CELL);ctx.lineTo(x,b);}ctx.stroke();}
ctx.beginPath();ctx.moveTo(l+3*CELL,t);ctx.lineTo(l+5*CELL,t+2*CELL);ctx.moveTo(l+5*CELL,t);ctx.lineTo(l+3*CELL,t+2*CELL);ctx.moveTo(l+3*CELL,t+7*CELL);ctx.lineTo(l+5*CELL,t+9*CELL);ctx.moveTo(l+5*CELL,t+7*CELL);ctx.lineTo(l+3*CELL,t+9*CELL);ctx.stroke();
ctx.fillStyle="#2c3e50";
ctx.font='22px "KaiTi",serif';ctx.textAlign='center';ctx.textBaseline='middle';
ctx.fillText('楚  河',l+2*CELL,t+4.5*CELL);ctx.fillText('汉  界',l+6*CELL,t+4.5*CELL);
}
function drawSinglePiece(x,y,p){
const rad=CELL*0.42;
ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);
ctx.fillStyle="#e8edf1";
ctx.fill();
ctx.lineWidth=2;
if(p.color===RED){
    ctx.strokeStyle="#c0392b";
}else{
    ctx.strokeStyle="#1a252f";
}
ctx.stroke();
ctx.beginPath();ctx.arc(x,y,rad-4,0,Math.PI*2);
if(p.color===RED){
    ctx.strokeStyle="rgba(192,57,43,0.4)";
}else{
    ctx.strokeStyle="rgba(26,37,47,0.4)";
}
ctx.lineWidth=1;ctx.stroke();
if(p.color===RED){
    ctx.fillStyle="#c0392b";
}else{
    ctx.fillStyle="#1a252f";
}
ctx.font=`bold ${Math.floor(CELL*0.48)}px "KaiTi",serif`;
ctx.fillText(NAMES[p.color][p.type],x,y+1);
}
// ==============================================================

function drawPieces(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(p)drawSinglePiece(MARGIN+c*CELL,MARGIN+r*CELL,p);}}
function drawAnimation(){if(!animating||!animData)return;const el=performance.now()-animData.startTime,t=Math.min(el/ANIM,1),e=1-Math.pow(1-t,3);const sx=MARGIN+animData.from.c*CELL,sy=MARGIN+animData.from.r*CELL,ex=MARGIN+animData.to.c*CELL,ey=MARGIN+animData.to.r*CELL;drawSinglePiece(sx+(ex-sx)*e,sy+(ey-sy)*e,animData.piece);}
function drawSelectionAndMoves(){if(animating||isAiThinking)return;for(const[r,c]of legalMoves){const x=MARGIN+c*CELL,y=MARGIN+r*CELL;if(board[r][c]){ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='rgba(20,150,80,.85)';ctx.lineWidth=4;ctx.stroke();}else{ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle='rgba(20,150,80,.75)';ctx.fill();}}if(selected){const x=MARGIN+selected.c*CELL,y=MARGIN+selected.r*CELL;ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=4;ctx.stroke();}}
function updateStatus(){if(gameOver){statusEl.textContent=winner===RED?'🎉 闯关成功！你赢了！':'❌ 闯关失败，电脑赢了！';return;}if(isAiThinking){statusEl.textContent='电脑思考中...';return;}let text=turn===RED?'轮到你走棋了':'轮到电脑';if(isInCheck(board,turn))text+=' · 将军！';statusEl.textContent=text;}
function draw(){drawBoard();drawPieces();drawSelectionAndMoves();drawAnimation();updateStatus();}
canvas.addEventListener('click',e=>{
if(animating||isAiThinking)return;
const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(canvas.width/rect.width),y=(e.clientY-rect.top)*(canvas.height/rect.height);
const c=Math.round((x-MARGIN)/CELL),r=Math.round((y-MARGIN)/CELL);
if(!inBoard(r,c))return;
if(Math.hypot(x-(MARGIN+c*CELL),y-(MARGIN+r*CELL))>CELL*0.55)return;
handleClick(r,c);
});
document.getElementById('undoBtn').addEventListener('click',()=>{initBoard();});
document.getElementById('restartBtn').addEventListener('click',()=>{initBoard();});
initMenu();
})();
</script>
</body>
</html>
