<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 - 联机对战</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b2118;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f5e6c8}#status{min-height:24px;margin:6px 0;font-size:16px;color:#ffd166}canvas{background:#e9c98b;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:96vw;height:auto;touch-action:manipulation}.controls{margin:12px 0 20px;display:flex;gap:12px}button{padding:8px 24px;border:none;border-radius:6px;background:#c0392b;color:white;font-size:15px;cursor:pointer}button:disabled{background:#555;cursor:not-allowed}#undoBtn{background:#2980b9}#menuBtn{background:#27ae60}#lobby,#waiting{display:flex;flex-direction:column;align-items:center;gap:20px;background:#3a2c1f;padding:30px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);margin-bottom:20px}#roomInput{padding:10px;font-size:16px;border-radius:6px;border:1px solid #5a3a1a;width:200px;text-align:center}
</style>
<script src="mqtt.min.js"></script>
</head>
<body>
<h1 id="title">中国象棋 · 联机对战</h1>
<div id="lobby">
<input id="roomInput" placeholder="输入房间号(暗号)" maxlength="20">
<button id="createBtn" style="background:#27ae60">创建房间 (红方)</button>
<button id="joinBtn" style="background:#2980b9">加入房间 (黑方)</button>
<button onclick="window.location.href='index.html'" style="background:#c0392b">返回主菜单</button>
</div>
<div id="waiting" style="display:none">
<h2 id="waitText">正在连接服务器...</h2>
<p>房间号: <span id="showRoom" style="color:#ffd166;font-weight:bold"></span></p >
<button id="cancelBtn" style="background:#555">取消</button>
</div>
<div id="gameArea" style="display:none;flex-direction:column;align-items:center;">
<div id="status"></div>
<canvas id="board" width="560" height="620"></canvas>
<div class="controls"><button id="undoBtn">请求悔棋</button><button id="restartBtn" style="display:none">重新开始(房主)</button><button id="exitBtn" style="background:#c0392b">退出房间</button></div>
</div>
<script>
(()=>{
const COLS=9,ROWS=10,CELL=60,MARGIN=40,RED='r',BLACK='b',ANIM=200;
const myId=Math.random().toString(36).substring(2); // 唯一标识，防止收到自己的消息
const sfxMove=new Audio('move.mp3'),sfxCapture=new Audio('capture.mp3'),sfxCheck=new Audio('check.mp3'),sfxWin=new Audio('win.mp3');
sfxMove.preload='auto';sfxCapture.preload='auto';sfxCheck.preload='auto';sfxWin.preload='auto';
let currentAudio=null;
function playSfx(audio){if(currentAudio&&currentAudio!==audio){currentAudio.pause();currentAudio.currentTime=0;}try{audio.currentTime=0;audio.play().catch(()=>{});currentAudio=audio;}catch(e){}}
const NAMES={r:{K:'帅',A:'仕',B:'相',N:'傌',R:'俥',C:'炮',P:'兵'},b:{K:'将',A:'士',B:'象',N:'馬',R:'車',C:'砲',P:'卒'}};
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),statusEl=document.getElementById('status');
let board,turn,selected,legalMoves,gameOver,winner,animating=false,animData=null;
let client=null,myColor=null,roomTopic="",history=[];
const put=(r,c,type,color)=>board[r][c]={type,color};
const inBoard=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS;
const getViewR=r=>myColor===BLACK?9-r:r;
const getViewC=c=>myColor===BLACK?8-c:c;
function initBoard(){
board=Array.from({length:ROWS},()=>Array(COLS).fill(null));
const back=['R','N','B','A','K','A','B','N','R'];
for(let c=0;c<COLS;c++){put(0,c,back[c],BLACK);put(9,c,back[c],RED);}
put(2,1,'C',BLACK);put(2,7,'C',BLACK);put(7,1,'C',RED);put(7,7,'C',RED);
for(let c=0;c<COLS;c+=2){put(3,c,'P',BLACK);put(6,c,'P',RED);}
turn=RED;selected=null;legalMoves=[];gameOver=false;winner=null;animating=false;animData=null;history=[];
document.getElementById('gameArea').style.display='flex';
document.getElementById('lobby').style.display='none';
document.getElementById('waiting').style.display='none';
document.getElementById('restartBtn').style.display=(myColor===RED)?'block':'none';
document.getElementById('title').textContent=(myColor===RED?'[红方] ':'[黑方] ')+"联机象棋";
draw();
}
function getPseudoMoves(b,r,c){
const p=b[r][c];if(!p)return[];
const{type,color}=p,moves=[],dirs=[[-1,0],[1,0],[0,-1],[0,1]];
const add=(nr,nc)=>{if(!inBoard(nr,nc))return;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);};
if(type==='R'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc;while(inBoard(nr,nc)){const t=b[nr][nc];if(!t)moves.push([nr,nc]);else{if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
else if(type==='C'){for(const[dr,dc]of dirs){let nr=r+dr,nc=c+dc,j=false;while(inBoard(nr,nc)){const t=b[nr][nc];if(!j){if(!t)moves.push([nr,nc]);else j=true;}else if(t){if(t.color!==color)moves.push([nr,nc]);break;}nr+=dr;nc+=dc;}}}
else if(type==='N'){const j=[[-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],[-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]];for(const[dr,dc,lr,lc]of j){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||b[r+lr][c+lc])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='B'){for(const[dr,dc]of[[-2,-2],[-2,2],[2,-2],[2,2]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc)||(color===RED&&nr<5)||(color===BLACK&&nr>4)||b[r+dr/2][c+dc/2])continue;const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='A'){for(const[dr,dc]of[[-1,-1],[-1,1],[1,-1],[1,1]]){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='K'){for(const[dr,dc]of dirs){const nr=r+dr,nc=c+dc;if(!inBoard(nr,nc))continue;if(color===RED){if(nr<7||nr>9||nc<3||nc>5)continue;}else{if(nr<0||nr>2||nc<3||nc>5)continue;}const t=b[nr][nc];if(!t||t.color!==color)moves.push([nr,nc]);}}
else if(type==='P'){const f=color===RED?-1:1;add(r+f,c);if(color===RED?r<=4:r>=5){add(r,c-1);add(r,c+1);}}
return moves;
}
function findKing(b,color){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(p&&p.color===color&&p.type==='K')return[r,c];}return null;}
function isInCheck(b,color){
const k=findKing(b,color);if(!k)return true;
const[kr,kc]=k,enemy=color===RED?BLACK:RED,ek=findKing(b,enemy);
if(ek){const[er,ec]=ek;if(ec===kc){let bl=false,st=Math.min(kr,er)+1,ed=Math.max(kr,er);for(let r=st;r<ed;r++)if(b[r][kc]){bl=true;break;}if(!bl)return true;}}
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=b[r][c];if(!p||p.color!==enemy)continue;if(getPseudoMoves(b,r,c).some(([mr,mc])=>mr===kr&&mc===kc))return true;}
return false;
}
function getLegalMoves(b,r,c){
const p=b[r][c];if(!p)return[];
const res=[];
for(const[nr,nc]of getPseudoMoves(b,r,c)){
const cap=b[nr][nc];b[nr][nc]=p;b[r][c]=null;
if(!isInCheck(b,p.color))res.push([nr,nc]);
b[r][c]=p;b[nr][nc]=cap;
}
return res;
}
function handleClick(r,c){
if(gameOver||animating||turn!==myColor||!inBoard(r,c))return;
const p=board[r][c];
if(selected){
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();return;}
if(legalMoves.some(([mr,mc])=>mr===r&&mc===c)){
const from=selected,to={r,c};
selected=null;legalMoves=[];
client.publish(roomTopic,JSON.stringify({type:'move',from,to,sender:myId}));
executeMove(from,to);
return;
}
selected=null;legalMoves=[];draw();return;
}
if(p&&p.color===turn){selected={r,c};legalMoves=getLegalMoves(board,r,c);draw();}
}
function executeMove(from,to){
if(!board[from.r]||!board[from.r][from.c])return; // 防止二次执行报错
selected=null;legalMoves=[];
const moving=board[from.r][from.c],cap=board[to.r][to.c];
history.push({from:{...from},to:{...to},piece:{...moving},captured:cap?{...cap}:null,turnBefore:turn});
startMoveAnimation(moving,from,to,cap);
}
function startMoveAnimation(piece,from,to,cap){
animating=true;animData={piece,from,to,cap,startTime:performance.now()};
board[from.r][from.c]=null;
function step(now){
if(!animating)return;
if(now-animData.startTime<ANIM){draw();requestAnimationFrame(step);}
else{board[animData.to.r][animData.to.c]=animData.piece;animating=false;animData=null;finishMove(piece,to,cap);}
}
requestAnimationFrame(step);
}
function finishMove(moving,to,cap){
let isWin=false;
if(cap&&cap.type==='K'){isWin=true;}
else{
turn=turn===RED?BLACK:RED;
const oppMoves=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const p=board[r][c];if(p&&p.color===turn)for(const[nr,nc]of getLegalMoves(board,r,c))oppMoves.push(1);}
const checked=isInCheck(board,turn);
if(oppMoves.length===0){isWin=true;}
else if(checked){playSfx(sfxCheck);}
else if(cap){playSfx(sfxCapture);}
else{playSfx(sfxMove);}
}
if(isWin){gameOver=true;winner=moving.color;playSfx(sfxWin);}
draw();
}
function setupMQTT(topic,isCreator){
roomTopic=topic;
client=mqtt.connect('wss://broker.emqx.io:8084/mqtt');
document.getElementById('waitText').textContent='正在连接公共服务器...';
client.on('connect',()=>{
client.subscribe(topic);
if(isCreator){
document.getElementById('waitText').textContent='等待对手加入...';
}else{
document.getElementById('waitText').textContent='正在加入房间...';
client.publish(topic,JSON.stringify({type:'join',sender:myId}));
}
});
client.on('message',(t,msg)=>{
const data=JSON.parse(msg.toString());
if(data.sender===myId)return; // 忽略自己发的消息，彻底杜绝残影Bug
if(data.type==='join'&&isCreator){
client.publish(topic,JSON.stringify({type:'start',sender:myId}));
initBoard();
}else if(data.type==='start'&&!isCreator){
initBoard();
}else if(data.type==='move'){
executeMove(data.from,data.to);
}else if(data.type==='undo_req'){
if(confirm('对方请求悔棋，是否同意？')){
client.publish(topic,JSON.stringify({type:'undo_agree',sender:myId}));
doUndo();
}
}else if(data.type==='undo_agree'){
doUndo();
}else if(data.type==='restart_req'){
if(confirm('房主重新开始了游戏')){
initBoard();
}
}else if(data.type==='exit'){
alert('对方已退出房间');
window.location.reload();
}
});
}
function doUndo(){
if(history.length>0){
const l=history.pop();
board[l.from.r][l.from.c]=l.piece;board[l.to.r][l.to.c]=l.captured;
turn=l.turnBefore;gameOver=false;winner=null;selected=null;legalMoves=[];draw();
}
}
function drawBoard(){
ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#e9c98b';ctx.fillRect(0,0,canvas.width,canvas.height);
const l=MARGIN,t=MARGIN,r=MARGIN+(COLS-1)*CELL,b=MARGIN+(ROWS-1)*CELL;
ctx.strokeStyle='#5a3a1a';ctx.lineWidth=1.5;ctx.lineCap='round';
for(let i=0;i<ROWS;i++){ctx.beginPath();ctx.moveTo(l,t+i*CELL);ctx.lineTo(r,t+i*CELL);ctx.stroke();}
for(let i=0;i<COLS;i++){ctx.beginPath();const x=l+i*CELL;if(i===0||i===COLS-1){ctx.moveTo(x,t);ctx.lineTo(x,b);}else{ctx.moveTo(x,t);ctx.lineTo(x,t+4*CELL);ctx.moveTo(x,t+5*CELL);ctx.lineTo(x,b);}ctx.stroke();}
ctx.beginPath();ctx.moveTo(l+3*CELL,t);ctx.lineTo(l+5*CELL,t+2*CELL);ctx.moveTo(l+5*CELL,t);ctx.lineTo(l+3*CELL,t+2*CELL);ctx.moveTo(l+3*CELL,t+7*CELL);ctx.lineTo(l+5*CELL,t+9*CELL);ctx.moveTo(l+5*CELL,t+7*CELL);ctx.lineTo(l+3*CELL,t+9*CELL);ctx.stroke();
ctx.fillStyle='rgba(90,58,26,.65)';ctx.font='22px "KaiTi","SimSun",serif';ctx.textAlign='center';ctx.textBaseline='middle';
if(myColor===BLACK){ctx.fillText('楚  河',l+6*CELL,t+4.5*CELL);ctx.fillText('汉  界',l+2*CELL,t+4.5*CELL);}
else{ctx.fillText('楚  河',l+2*CELL,t+4.5*CELL);ctx.fillText('汉  界',l+6*CELL,t+4.5*CELL);}
}
function drawSinglePiece(x,y,p){
const rad=CELL*0.42;
ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fillStyle='#f8e6bd';ctx.fill();
ctx.lineWidth=2;ctx.strokeStyle=p.color===RED?'#b3261e':'#222';ctx.stroke();
ctx.beginPath();ctx.arc(x,y,rad-4,0,Math.PI*2);ctx.strokeStyle=p.color===RED?'rgba(179,38,30,.45)':'rgba(34,34,34,.35)';ctx.lineWidth=1;ctx.stroke();
ctx.fillStyle=p.color===RED?'#b3261e':'#111';ctx.font=`bold ${Math.floor(CELL*0.48)}px "KaiTi","SimSun",serif`;ctx.fillText(NAMES[p.color][p.type],x,y+1);
}
function drawPieces(){
for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
const p=board[r][c];if(p){const vr=getViewR(r),vc=getViewC(c);drawSinglePiece(MARGIN+vc*CELL,MARGIN+vr*CELL,p);}
}
}
function drawAnimation(){
if(!animating||!animData)return;
const el=performance.now()-animData.startTime,t=Math.min(el/ANIM,1),e=1-Math.pow(1-t,3);
const fr=getViewR(animData.from.r),fc=getViewC(animData.from.c),tr=getViewR(animData.to.r),tc=getViewC(animData.to.c);
const sx=MARGIN+fc*CELL,sy=MARGIN+fr*CELL,ex=MARGIN+tc*CELL,ey=MARGIN+tr*CELL;
drawSinglePiece(sx+(ex-sx)*e,sy+(ey-sy)*e,animData.piece);
}
function drawSelectionAndMoves(){
if(animating)return;
for(const[r,c]of legalMoves){
const vr=getViewR(r),vc=getViewC(c),x=MARGIN+vc*CELL,y=MARGIN+vr*CELL;
if(board[r][c]){ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='rgba(20,150,80,.85)';ctx.lineWidth=4;ctx.stroke();}
else{ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fillStyle='rgba(20,150,80,.75)';ctx.fill();}
}
if(selected){const vr=getViewR(selected.r),vc=getViewC(selected.c),x=MARGIN+vc*CELL,y=MARGIN+vr*CELL;ctx.beginPath();ctx.arc(x,y,CELL*0.48,0,Math.PI*2);ctx.strokeStyle='#f1c40f';ctx.lineWidth=4;ctx.stroke();}
}
function updateStatus(){
if(gameOver){statusEl.textContent=winner===RED?'红方胜！':'黑方胜！';return;}
let text=`轮到 ${turn===RED?'红方':'黑方'} `;
if(turn===myColor)text+='(你)';else text+='(对方)';
if(isInCheck(board,turn))text+=' · 将军！';
statusEl.textContent=text;
}
function draw(){drawBoard();drawPieces();drawSelectionAndMoves();drawAnimation();updateStatus();}
canvas.addEventListener('click',e=>{
if(animating)return;
const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*(canvas.width/rect.width),y=(e.clientY-rect.top)*(canvas.height/rect.height);
let c=Math.round((x-MARGIN)/CELL),r=Math.round((y-MARGIN)/CELL);
if(!inBoard(r,c))return;
if(Math.hypot(x-(MARGIN+c*CELL),y-(MARGIN+r*CELL))>CELL*0.55)return;
if(myColor===BLACK){r=9-r;c=8-c;}
handleClick(r,c);
});
document.getElementById('createBtn').addEventListener('click',()=>{
const room=document.getElementById('roomInput').value.trim();
if(!room){alert('请输入房间号');return;}
myColor=RED;document.getElementById('showRoom').textContent=room;
document.getElementById('lobby').style.display='none';document.getElementById('waiting').style.display='flex';
setupMQTT('chess_'+room,true);
});
document.getElementById('joinBtn').addEventListener('click',()=>{
const room=document.getElementById('roomInput').value.trim();
if(!room){alert('请输入房间号');return;}
myColor=BLACK;document.getElementById('showRoom').textContent=room;
document.getElementById('lobby').style.display='none';document.getElementById('waiting').style.display='flex';
setupMQTT('chess_'+room,false);
});
document.getElementById('undoBtn').addEventListener('click',()=>{if(client)client.publish(roomTopic,JSON.stringify({type:'undo_req',sender:myId}));});
document.getElementById('restartBtn').addEventListener('click',()=>{if(client)client.publish(roomTopic,JSON.stringify({type:'restart_req',sender:myId}));initBoard();});
document.getElementById('exitBtn').addEventListener('click',()=>{if(client)client.publish(roomTopic,JSON.stringify({type:'exit',sender:myId}));window.location.reload();});
document.getElementById('cancelBtn').addEventListener('click',()=>{window.location.reload();});
})();
</script>
</body>
</html>
