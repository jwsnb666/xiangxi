<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国象棋 · 游戏大厅</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#2b2118;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#f5e6c8;background-image:radial-gradient(circle at center, #3a2c1f 0%, #1a130d 100%);padding:20px}
h1{font-size:32px;margin-bottom:30px;color:#ffd166;letter-spacing:4px;text-shadow:0 4px 15px rgba(0,0,0,.8), 0 0 20px rgba(255,209,102,.3)}
.menu{display:grid;grid-template-columns:repeat(2, 1fr);gap:15px;width:100%;max-width:420px}
button{padding:15px 20px;border:none;border-radius:10px;color:white;font-size:16px;font-weight:bold;cursor:pointer;transition:all .2s;box-shadow:0 6px 15px rgba(0,0,0,.4);letter-spacing:1px}
button:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.6);filter:brightness(1.1)}
button:active{transform:translateY(1px)}
.btn-friend{background:linear-gradient(135deg, #c0392b, #962d22)}
.btn-ai{background:linear-gradient(135deg, #2980b9, #1f618d)}
.btn-online{background:linear-gradient(135deg, #27ae60, #1e8449)}
.btn-sandbox{background:linear-gradient(135deg, #d35400, #a04000)}
.btn-mod-load{background:linear-gradient(135deg, #8e44ad, #6c3483)}
.btn-mod-make{background:linear-gradient(135deg, #f39c12, #d68910)}
/* 盲盒揭棋按钮的专属酷炫渐变色 */
.btn-jieqi{background:linear-gradient(135deg, #e74c3c, #8e44ad); grid-column: span 2;}
</style>
</head>
<body>
<h1>中国象棋</h1>
<div class="menu">
  <button class="btn-friend" onclick="location.href='friends.html'">双人对战</button>
  <button class="btn-ai" onclick="location.href='ai.html'">人机对战</button>
  <button class="btn-online" onclick="location.href='online.html'">联机对战</button>
  
  <!-- 手机端和电脑端自动识别 -->
  <button class="btn-sandbox" onclick="goTo('sandbox')">创造模式</button>
  <button class="btn-mod-load" onclick="goTo('mod')">模组加载</button>
  
  <button class="btn-mod-make" onclick="location.href='creator.html'">模组制造</button>
  
  <!-- 盲盒揭棋入口，已接通！ -->
  <button class="btn-jieqi" onclick="location.href='jieqi.html'">🎁 盲盒揭棋</button>
</div>

<script>
function goTo(pageName) {
  // 检测是不是手机端
  const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  if (isMobile) {
    // 手机端跳去带 2 的粘贴版
    location.href = pageName + '2.html';
  } else {
    // 电脑端跳去原版
    location.href = pageName + '.html';
  }
}
</script>
</body>
</html>
